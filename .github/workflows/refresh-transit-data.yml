name: Refresh transit data

on:
  schedule:
    - cron: '17 4 1 * *' # monthly; GitHub schedules are best-effort
  workflow_dispatch:
    inputs:
      allow_removal:
        description: 'Accept lines that have disappeared from the feed'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-transit-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remember the published data
        run: cp public/data/lines.json "$RUNNER_TEMP/previous-lines.json"
      - name: Download the feed and build the dataset
        run: npm run data
        env:
          TRAFIKLAB_API_KEY: ${{ secrets.TRAFIKLAB_API_KEY }}
      - name: Validate (fails the job, and nothing is published, on errors)
        run: npm run data:validate -- --previous="$RUNNER_TEMP/previous-lines.json"
        env:
          ALLOW_REMOVAL: ${{ inputs.allow_removal && '1' || '0' }}
      - name: Commit and deploy if the line data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet HEAD -- public/data/manifest.json; then
            echo "No change in line data."; exit 0
          fi
          if [ "$(git show HEAD:public/data/manifest.json | node -p 'JSON.parse(require("fs").readFileSync(0)).hash')" = "$(node -p 'require("./public/data/manifest.json").hash')" ]; then
            echo "Same line hash; skipping."; git checkout -- public/data; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh transit data $(date -u +%Y-%m-%d)"
          git push
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"
